name: Build CAMM Ecosystem

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: mobile-android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x mobile-android/gradlew

      - name: Build Android Release APK
        working-directory: mobile-android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: camm-android-release-apk
          path: mobile-android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download and Configure Prebuilt FFmpeg Dev Libraries
        shell: powershell
        run: |
          Write-Host "Downloading FFmpeg Windows Dev / Shared release..."
          $destZip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile $destZip
          Expand-Archive -Path $destZip -DestinationPath "C:\ffmpeg" -Force
          $extractedFolder = (Get-ChildItem -Directory "C:\ffmpeg" | Select-Object -First 1).FullName
          Write-Host "Configuring FFMPEG_DIR=$extractedFolder"
          echo "FFMPEG_DIR=$extractedFolder" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$extractedFolder\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Desktop Node Dependencies
        working-directory: desktop-windows
        run: npm ci

      - name: Build Tauri Desktop Application
        working-directory: desktop-windows
        run: npm run tauri build

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: camm-desktop-windows
          path: |
            desktop-windows/src-tauri/target/release/camm-desktop.exe
            desktop-windows/src-tauri/target/release/bundle/msi/*.msi
            desktop-windows/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
